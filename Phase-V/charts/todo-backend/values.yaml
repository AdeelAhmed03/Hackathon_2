# Todo Backend Helm Chart Values
# T033: Updated for Phase V with Dapr integration

# Replica configuration
replicaCount: 1

# Container image
image:
  repository: todo-backend
  tag: v5.0.0
  pullPolicy: IfNotPresent

# Dapr configuration (T033)
dapr:
  enabled: true
  appId: "todo-backend"
  appPort: 8000
  logLevel: "info"
  config: "dapr-config"

# Service configuration
service:
  type: LoadBalancer
  port: 8000

# Secret values (set via --set, never commit real values)
secrets:
  cohereApiKey: ""           # REQUIRED: Set via --set secrets.cohereApiKey=xxx
  betterAuthSecret: ""       # REQUIRED: Set via --set secrets.betterAuthSecret=xxx
  databaseUrl: "postgresql://postgres:password@postgres:5432/todo"

# Non-sensitive configuration
config:
  frontendUrl: "http://todo-frontend:3000"
  port: "8000"

# Resource limits
resources:
  requests:
    memory: "256Mi"
    cpu: "100m"
  limits:
    memory: "512Mi"
    cpu: "500m"

# Security context
securityContext:
  runAsNonRoot: true
  runAsUser: 1001

# Health probes
livenessProbe:
  enabled: true
  httpGet:
    path: /health
    port: 8000
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  enabled: true
  httpGet:
    path: /health
    port: 8000
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

# Ingress configuration (optional)
ingress:
  enabled: false
  className: nginx
  annotations: {}
  hosts:
    - host: todo.local
      paths:
        - path: /api
          pathType: Prefix

# Pod annotations - Dapr sidecar injection (T033)
podAnnotations:
  dapr.io/enabled: "true"
  dapr.io/app-id: "todo-backend"
  dapr.io/app-port: "8000"
  dapr.io/log-level: "info"
  dapr.io/config: "dapr-config"

# Node selector
nodeSelector: {}

# Tolerations
tolerations: []

# Affinity
affinity: {}
