[pytest]
testpaths = e2e
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    e2e: End-to-end tests requiring running services
    slow: Tests that may take a long time to complete

# Default options
addopts = -v --tb=short

# Async mode for pytest-asyncio
asyncio_mode = auto

# Timeout for tests (in seconds)
timeout = 120
