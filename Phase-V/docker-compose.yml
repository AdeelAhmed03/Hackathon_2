# Phase V: Event-Driven Architecture Docker Compose
# Cloud-ready configuration with Neon PostgreSQL

services:
  # Backend API Service - Built from local Dockerfile
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: todo-backend:v5.0.0
    container_name: todo-backend
    dns:
      - 8.8.8.8
      - 8.8.4.4
    environment:
      DATABASE_URL: ${DATABASE_URL}
      COHERE_API_KEY: ${COHERE_API_KEY}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      FRONTEND_URL: http://localhost:3000
      PORT: 8000
      DAPR_HTTP_PORT: 3500
      PUBSUB_NAME: kafka-pubsub
    ports:
      - "8000:8000"
    networks:
      - todo-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Frontend Service - Built from local Dockerfile
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: todo-frontend:v5.0.0
    container_name: todo-frontend
    dns:
      - 8.8.8.8
      - 8.8.4.4
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
      BACKEND_API_URL: http://backend:8000
      NEXT_PUBLIC_BASE_URL: http://localhost:3000
      DATABASE_URL: ${DATABASE_URL}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - todo-network
    restart: unless-stopped

  # Notification Service - Built from local Dockerfile
  notification-service:
    build:
      context: ./notification-service
      dockerfile: Dockerfile
    image: notification-service:v5.0.0
    container_name: notification-service
    dns:
      - 8.8.8.8
      - 8.8.4.4
    environment:
      DATABASE_URL: ${DATABASE_URL}
      DAPR_HTTP_PORT: 3500
      PUBSUB_NAME: kafka-pubsub
      LOG_LEVEL: INFO
      LOG_FORMAT: json
      PORT: 8001
    ports:
      - "8001:8001"
    networks:
      - todo-network
    restart: unless-stopped

  # Recurring Service - Built from local Dockerfile
  recurring-service:
    build:
      context: ./recurring-service
      dockerfile: Dockerfile
    image: recurring-service:v5.0.0
    container_name: recurring-service
    dns:
      - 8.8.8.8
      - 8.8.4.4
    environment:
      DATABASE_URL: ${DATABASE_URL}
      BACKEND_URL: http://backend:8000
      DAPR_HTTP_PORT: 3500
      PUBSUB_NAME: kafka-pubsub
      LOG_LEVEL: INFO
      LOG_FORMAT: json
      PORT: 8002
    ports:
      - "8002:8002"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - todo-network
    restart: unless-stopped

networks:
  todo-network:
    driver: bridge
