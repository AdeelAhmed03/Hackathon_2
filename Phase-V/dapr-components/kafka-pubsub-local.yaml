# Dapr Kafka Pub/Sub Component - Local Configuration (Strimzi)
# T002: Local Kafka configuration for Minikube development
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: kafka-pubsub
  namespace: default
spec:
  type: pubsub.kafka
  version: v1
  metadata:
    - name: brokers
      value: "kafka-cluster-kafka-bootstrap.kafka.svc.cluster.local:9092"
    - name: consumerGroup
      value: "todo-app"
    - name: authType
      value: "none"
    - name: initialOffset
      value: "oldest"
    - name: maxMessageBytes
      value: "1048576"
    - name: compressionType
      value: "gzip"
    - name: version
      value: "3.6.0"
  scopes:
    - todo-backend
    - notification-service
    - recurring-service
