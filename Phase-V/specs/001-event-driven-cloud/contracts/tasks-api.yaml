openapi: 3.1.0
info:
  title: Todo Tasks API - Phase V
  description: Enhanced task management API with priorities, tags, search, filter, sort, and event-driven features
  version: 5.0.0
  contact:
    name: Todo API Team

servers:
  - url: http://localhost:8000/api
    description: Local development
  - url: https://todo-backend.example.com/api
    description: Production

security:
  - bearerAuth: []

paths:
  /tasks:
    get:
      summary: List tasks with filtering, searching, and sorting
      operationId: listTasks
      tags: [Tasks]
      parameters:
        - name: q
          in: query
          description: Search keyword (case-insensitive match on title and description)
          schema:
            type: string
        - name: status
          in: query
          description: Filter by task status
          schema:
            type: string
            enum: [pending, completed]
        - name: priority
          in: query
          description: Filter by priority
          schema:
            type: string
            enum: [low, medium, high]
        - name: tags
          in: query
          description: Filter by tags (AND logic - task must have ALL specified tags)
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
        - name: due_before
          in: query
          description: Filter tasks due before this datetime (ISO8601)
          schema:
            type: string
            format: date-time
        - name: due_after
          in: query
          description: Filter tasks due after this datetime (ISO8601)
          schema:
            type: string
            format: date-time
        - name: sort_by
          in: query
          description: Field to sort by
          schema:
            type: string
            enum: [created_at, due_at, priority, title]
            default: created_at
        - name: sort_order
          in: query
          description: Sort direction
          schema:
            type: string
            enum: [asc, desc]
            default: desc
        - name: page
          in: query
          description: Page number (1-indexed)
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: page_size
          in: query
          description: Number of items per page
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: List of tasks
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      summary: Create a new task
      operationId: createTask
      tags: [Tasks]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskCreate'
      responses:
        '201':
          description: Task created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /tasks/{task_id}:
    get:
      summary: Get a specific task
      operationId: getTask
      tags: [Tasks]
      parameters:
        - name: task_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Task details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResponse'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      summary: Update a task
      operationId: updateTask
      tags: [Tasks]
      parameters:
        - name: task_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskUpdate'
      responses:
        '200':
          description: Task updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      summary: Delete a task
      operationId: deleteTask
      tags: [Tasks]
      parameters:
        - name: task_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Task deleted successfully
        '404':
          $ref: '#/components/responses/NotFound'

  /tasks/{task_id}/complete:
    post:
      summary: Mark a task as completed
      description: |
        Marks the task as completed. If the task has a recurring_interval,
        a new task is automatically created with updated due_at.
      operationId: completeTask
      tags: [Tasks]
      parameters:
        - name: task_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Task completed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  completed_task:
                    $ref: '#/components/schemas/TaskResponse'
                  next_task:
                    description: New task created for recurring tasks
                    oneOf:
                      - $ref: '#/components/schemas/TaskResponse'
                      - type: 'null'
        '404':
          $ref: '#/components/responses/NotFound'

  /tags:
    get:
      summary: List user's tags
      operationId: listTags
      tags: [Tags]
      responses:
        '200':
          description: List of tags
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TagResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      summary: Create a new tag
      operationId: createTag
      tags: [Tags]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TagCreate'
      responses:
        '201':
          description: Tag created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: Tag with this name already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /tags/{tag_id}:
    delete:
      summary: Delete a tag
      operationId: deleteTag
      tags: [Tags]
      parameters:
        - name: tag_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Tag deleted successfully
        '404':
          $ref: '#/components/responses/NotFound'

  /chat:
    post:
      summary: Send a chat message to AI assistant
      description: |
        Process natural language commands via Cohere AI.
        The assistant can create, list, complete, update, and delete tasks.
      operationId: chat
      tags: [Chat]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
      responses:
        '200':
          description: Chat response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    TaskCreate:
      type: object
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
          nullable: true
        priority:
          type: string
          enum: [low, medium, high]
          default: medium
        due_at:
          type: string
          format: date-time
          nullable: true
          description: Due date in ISO8601 format (UTC)
        remind_at:
          type: string
          format: date-time
          nullable: true
          description: Reminder time in ISO8601 format (must be before due_at)
        recurring_interval:
          type: string
          enum: [daily, weekly, monthly, yearly]
          nullable: true
          description: Recurrence pattern (requires due_at to be set)
        tags:
          type: array
          items:
            type: string
          default: []
          description: Tag names to associate with the task

    TaskUpdate:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
          nullable: true
        status:
          type: string
          enum: [pending, completed]
        priority:
          type: string
          enum: [low, medium, high]
        due_at:
          type: string
          format: date-time
          nullable: true
        remind_at:
          type: string
          format: date-time
          nullable: true
        recurring_interval:
          type: string
          enum: [daily, weekly, monthly, yearly]
          nullable: true
        tags:
          type: array
          items:
            type: string
          description: Replaces all existing tags

    TaskResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
          nullable: true
        status:
          type: string
          enum: [pending, completed]
        priority:
          type: string
          enum: [low, medium, high]
        due_at:
          type: string
          format: date-time
          nullable: true
        remind_at:
          type: string
          format: date-time
          nullable: true
        recurring_interval:
          type: string
          enum: [daily, weekly, monthly, yearly]
          nullable: true
        parent_task_id:
          type: string
          format: uuid
          nullable: true
        tags:
          type: array
          items:
            type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    TaskListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TaskResponse'
        total:
          type: integer
        page:
          type: integer
        page_size:
          type: integer
        total_pages:
          type: integer

    TagCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 50

    TagResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        task_count:
          type: integer
          description: Number of tasks with this tag
        created_at:
          type: string
          format: date-time

    ChatRequest:
      type: object
      required: [message]
      properties:
        message:
          type: string
          description: User's natural language message
        conversation_id:
          type: string
          format: uuid
          nullable: true
          description: Continue existing conversation (optional)

    ChatResponse:
      type: object
      properties:
        conversation_id:
          type: string
          format: uuid
        message:
          type: string
          description: Assistant's response
        action_taken:
          type: object
          nullable: true
          properties:
            action:
              type: string
              description: Tool that was executed
            result:
              type: object
              description: Result of the tool execution

    Error:
      type: object
      properties:
        detail:
          type: string
        code:
          type: string

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Missing or invalid authentication
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
