# Deploy Pipeline - Azure AKS (Staging and Production)
# Trigger: on push to develop (staging), on push to main (production)
name: Deploy to Azure AKS

on:
  push:
    branches:
      - main
      - master
      - develop
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

env:
  REGISTRY: ghcr.io
  PYTHON_VERSION: "3.13"
  NODE_VERSION: "22"
  # Azure AKS Configuration
  AKS_RESOURCE_GROUP: todo-app-rg
  AKS_CLUSTER_NAME: todo-aks-cluster

jobs:
  # Determine environment
  setup:
    name: Setup
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.set-env.outputs.environment }}
      image_tag: ${{ steps.set-env.outputs.image_tag }}
      namespace: ${{ steps.set-env.outputs.namespace }}
    steps:
      - name: Set environment
        id: set-env
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "environment=${{ github.event.inputs.environment }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref }}" == "refs/heads/main" ] || [ "${{ github.ref }}" == "refs/heads/master" ]; then
            echo "environment=production" >> $GITHUB_OUTPUT
          else
            echo "environment=staging" >> $GITHUB_OUTPUT
          fi
          echo "image_tag=${{ github.sha }}" >> $GITHUB_OUTPUT

          # Set namespace based on environment
          if [ "${{ github.ref }}" == "refs/heads/main" ] || [ "${{ github.ref }}" == "refs/heads/master" ]; then
            echo "namespace=production" >> $GITHUB_OUTPUT
          else
            echo "namespace=staging" >> $GITHUB_OUTPUT
          fi

  # Build and push images
  build-push:
    name: Build and Push Images
    runs-on: ubuntu-latest
    needs: setup
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        service:
          - name: todo-backend
            context: ./Phase-V/backend
          - name: todo-frontend
            context: ./Phase-V/frontend
          - name: notification-service
            context: ./Phase-V/notification-service
          - name: recurring-service
            context: ./Phase-V/recurring-service

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.service.name }}
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Deploy to staging (Azure AKS)
  deploy-staging:
    name: Deploy to Staging (AKS)
    runs-on: ubuntu-latest
    needs: [setup, build-push]
    if: needs.setup.outputs.environment == 'staging'
    environment: staging

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.14.0'

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Get AKS Credentials
        run: |
          az aks get-credentials \
            --resource-group ${{ env.AKS_RESOURCE_GROUP }} \
            --name ${{ env.AKS_CLUSTER_NAME }} \
            --overwrite-existing

      - name: Create namespace
        run: |
          kubectl create namespace staging --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy services
        env:
          IMAGE_TAG: ${{ needs.setup.outputs.image_tag }}
          NAMESPACE: staging
        run: |
          # Deploy PostgreSQL if not exists
          helm upgrade --install postgres ./Phase-V/charts/postgres \
            --namespace $NAMESPACE \
            --set persistence.enabled=true \
            --set persistence.storageClass=managed-csi \
            --wait --timeout 5m || true

          # Deploy backend
          helm upgrade --install todo-backend ./Phase-V/charts/todo-backend \
            --namespace $NAMESPACE \
            --set image.repository=${{ env.REGISTRY }}/${{ github.repository }}/todo-backend \
            --set image.tag=$IMAGE_TAG \
            --wait --timeout 5m

          # Deploy notification service
          helm upgrade --install notification-service ./Phase-V/charts/notification-service \
            --namespace $NAMESPACE \
            --set image.repository=${{ env.REGISTRY }}/${{ github.repository }}/notification-service \
            --set image.tag=$IMAGE_TAG \
            --wait --timeout 5m

          # Deploy recurring service
          helm upgrade --install recurring-service ./Phase-V/charts/recurring-service \
            --namespace $NAMESPACE \
            --set image.repository=${{ env.REGISTRY }}/${{ github.repository }}/recurring-service \
            --set image.tag=$IMAGE_TAG \
            --wait --timeout 5m

          # Deploy frontend
          helm upgrade --install todo-frontend ./Phase-V/charts/todo-frontend \
            --namespace $NAMESPACE \
            --set image.repository=${{ env.REGISTRY }}/${{ github.repository }}/todo-frontend \
            --set image.tag=$IMAGE_TAG \
            --wait --timeout 5m

      - name: Verify deployment
        run: |
          kubectl get pods -n staging
          kubectl get svc -n staging

  # Deploy to production (Azure AKS - with approval)
  deploy-production:
    name: Deploy to Production (AKS)
    runs-on: ubuntu-latest
    needs: [setup, build-push]
    if: needs.setup.outputs.environment == 'production'
    environment:
      name: production
      # Requires manual approval in GitHub settings

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.14.0'

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Get AKS Credentials
        run: |
          az aks get-credentials \
            --resource-group ${{ env.AKS_RESOURCE_GROUP }} \
            --name ${{ env.AKS_CLUSTER_NAME }} \
            --overwrite-existing

      - name: Create namespace
        run: |
          kubectl create namespace production --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy services
        env:
          IMAGE_TAG: ${{ needs.setup.outputs.image_tag }}
          NAMESPACE: production
        run: |
          # Deploy PostgreSQL if not exists
          helm upgrade --install postgres ./Phase-V/charts/postgres \
            --namespace $NAMESPACE \
            --set persistence.enabled=true \
            --set persistence.storageClass=managed-csi \
            --wait --timeout 5m || true

          # Deploy backend
          helm upgrade --install todo-backend ./Phase-V/charts/todo-backend \
            --namespace $NAMESPACE \
            --set image.repository=${{ env.REGISTRY }}/${{ github.repository }}/todo-backend \
            --set image.tag=$IMAGE_TAG \
            --wait --timeout 5m

          # Deploy notification service
          helm upgrade --install notification-service ./Phase-V/charts/notification-service \
            --namespace $NAMESPACE \
            --set image.repository=${{ env.REGISTRY }}/${{ github.repository }}/notification-service \
            --set image.tag=$IMAGE_TAG \
            --wait --timeout 5m

          # Deploy recurring service
          helm upgrade --install recurring-service ./Phase-V/charts/recurring-service \
            --namespace $NAMESPACE \
            --set image.repository=${{ env.REGISTRY }}/${{ github.repository }}/recurring-service \
            --set image.tag=$IMAGE_TAG \
            --wait --timeout 5m

          # Deploy frontend
          helm upgrade --install todo-frontend ./Phase-V/charts/todo-frontend \
            --namespace $NAMESPACE \
            --set image.repository=${{ env.REGISTRY }}/${{ github.repository }}/todo-frontend \
            --set image.tag=$IMAGE_TAG \
            --wait --timeout 5m

      - name: Verify deployment
        run: |
          kubectl get pods -n production
          kubectl get svc -n production

      # Rollback on failure
      - name: Rollback on failure
        if: failure()
        run: |
          echo "Deployment failed, initiating rollback..."
          helm rollback todo-backend -n production || true
          helm rollback notification-service -n production || true
          helm rollback recurring-service -n production || true
          helm rollback todo-frontend -n production || true
